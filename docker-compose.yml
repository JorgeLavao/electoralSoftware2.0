services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - ./.env
    environment:
      BOOTSTRAP_COMPOSER: "1"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: laravel-vite
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_started

  pgsql:
    image: postgres:16-alpine
    container_name: laravel-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpaconia
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail -d simpaconia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - ./.env
    environment:
      BOOTSTRAP_COMPOSER: "0"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: laravel-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - pgsql

volumes:
  pgsql_data:
  redis_data:
  vendor_data:
  node_modules_data:
