version: "3.9"

services:
  app:
    build:
      context: ./docker/php
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    depends_on:
      - db
      - redis

  # Nginx (servidor web)
  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # MySQL
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Redis
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Worker de colas (Queue)
  queue:
    build:
      context: ./docker/php
    container_name: laravel-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90

  phpmyadmin:
    image: phpmyadmin:5
    container_name: laravel-phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=laravel
      - PMA_PASSWORD=laravel
    depends_on:
      - db

volumes:
  mysql_data:
  redis_data:
